                <!--Contenido principal-->
    <main>
                    <!--Sección: Formulario de Suscripción-->
        <section>
            <h2>Formulario de Suscripción</h2>
            <div class="forma-contenedor">
                <form action="#" method="POST">
                    <div class="forma-usuario">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="forma-usuario">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
                    </div>
                    <div class="forma-usuario">
                        <label for="cedula">Número de cédula</label>
                        <input type="text" id="cedula" name="cedula" placeholder="v-362837451" required>
                    </div>
                    <div class="forma-usuario">
                        <label for="telefono">Número de teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="0412-7683100" required>
                    </div>

                    <div class="forma-usuario">
                        <label for="genero">Género</label>
                        <select name="genero" id="genero" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                            <option value="otro">Otro</option>
                            <option value="no-decir">Prefiero no decirlo</option>
                        </select>
                    </div>

                    <div class="forma-usuario">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="Correo@email.com" required>
                    </div>

                    <div class="forma-usuario">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <div class="forma-usuario">
                        <label for="notas">Notas o comentarios</label>
                        <input type="text" id="notas" name="notas" placeholder="Escribe aquí cualquier información adicional que desees compartir con nosotros.">
                    </div>

                    <button type="submit" class="boton">Enviar Suscripción</button>
                    
                </form>
            </div>
        </section>
    </main>
